
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>AJAX Car Modal | My Cars System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fa;
        }

        .car-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .table thead th {
            background: #198754;
            color: white;
        }

        .table td {
            vertical-align: middle;
        }

        .modal-header {
            background: #198754;
            color: white;
        }

        .detail-label {
            font-weight: 600;
            color: #555;
        }

        #modalDescription {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="list-cars.php">

            My Cars System

        </a>

        <a href="list-cars.php"
           class="btn btn-outline-light btn-sm">

            Back to Cars

        </a>

    </div>

</nav>

<div class="container py-5">

    <div class="car-card">

        <h2>AJAX Car Details</h2>

        <p class="text-muted">

            Click View Details to display car information
            without refreshing the page.

        </p>

        <div id="statusMessage"
             aria-live="polite">

            Loading cars...

        </div>

        <div class="table-responsive">

            <table class="table table-striped table-bordered">

                <thead>

                    <tr>

                        <th>Car Name</th>

                        <th>Rating</th>

                        <th>Established Date</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="carTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Bootstrap Modal -->

<div class="modal fade"
     id="carModal"
     tabindex="-1"
     aria-labelledby="modalTitle"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title"
                    id="modalTitle">

                    Car Details

                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Close">

                </button>

            </div>

            <div class="modal-body">

                <div id="modalStatus"
                     aria-live="polite">

                </div>

                <div id="modalDetails" hidden>

                    <h3 id="modalCarName"
                        class="text-success mb-4">

                    </h3>

                    <div class="mb-3">

                        <div class="detail-label">

                            Car ID

                        </div>

                        <p id="modalCarId"></p>

                    </div>

                    <div class="mb-3">

                        <div class="detail-label">

                            Description

                        </div>

                        <p id="modalDescription"></p>

                    </div>

                    <div class="mb-3">

                        <div class="detail-label">

                            Established Date

                        </div>

                        <p id="modalDate"></p>

                    </div>

                    <div class="mb-3">

                        <div class="detail-label">

                            Rating

                        </div>

                        <h4 id="modalRating"
                            class="text-success">

                        </h4>

                        <div class="progress">

                            <div id="ratingBar"
                                 class="progress-bar bg-success"
                                 role="progressbar"
                                 aria-label="Car rating"
                                 aria-valuemin="0"
                                 aria-valuemax="10"
                                 aria-valuenow="0"
                                 style="width: 0%">

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <a id="fullDetailsLink"
                   class="btn btn-success"
                   hidden>

                    Full Details

                </a>

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Close

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

const tableBody =
    document.getElementById("carTableBody");

const statusMessage =
    document.getElementById("statusMessage");

const modalElement =
    document.getElementById("carModal");

const carModal =
    new bootstrap.Modal(modalElement);

let latestRequest = 0;

// Load all cars using AJAX
function loadCars() {

    fetch("ajax.php")

        .then(response => {

            if (!response.ok) {

                throw new Error("Request failed");

            }

            return response.json();

        })

        .then(cars => {

            tableBody.replaceChildren();

            statusMessage.textContent = "";

            if (cars.length === 0) {

                statusMessage.textContent =
                    "No cars found.";

                return;

            }

            cars.forEach(car => {

                const id = Number(car.car_id);

                if (!Number.isSafeInteger(id) || id < 1) {

                    return;

                }

                const row =
                    document.createElement("tr");

                const nameCell =
                    document.createElement("td");

                nameCell.textContent = car.car_name;

                const ratingCell =
                    document.createElement("td");

                ratingCell.textContent =
                    car.rating + "/10";

                const dateCell =
                    document.createElement("td");

                dateCell.textContent =
                    car.established_date;

                const actionCell =
                    document.createElement("td");

                const button =
                    document.createElement("button");

                button.type = "button";

                button.className =
                    "btn btn-success btn-sm";

                button.textContent = "View Details";

                button.addEventListener(
                    "click",
                    function () {

                        showCarDetails(id);

                    }
                );

                actionCell.appendChild(button);

                row.appendChild(nameCell);

                row.appendChild(ratingCell);

                row.appendChild(dateCell);

                row.appendChild(actionCell);

                tableBody.appendChild(row);

            });

        })

        .catch(() => {

            statusMessage.textContent =
                "Unable to load cars.";

        });

}

// Retrieve individual car details
function showCarDetails(id) {

    const requestId = ++latestRequest;

    const modalStatus =
        document.getElementById("modalStatus");

    const modalDetails =
        document.getElementById("modalDetails");

    const fullDetailsLink =
        document.getElementById("fullDetailsLink");

    modalStatus.textContent = "Loading car details...";

    modalDetails.hidden = true;

    fullDetailsLink.hidden = true;

    carModal.show();

    fetch(
        "ajax-car-details.php?id=" +
        encodeURIComponent(id)
    )

        .then(response => {

            if (!response.ok) {

                throw new Error("Request failed");

            }

            return response.json();

        })

        .then(car => {

            if (requestId !== latestRequest) {

                return;

            }

            // textContent prevents HTML injection
            document.getElementById(
                "modalCarName"
            ).textContent = car.car_name;

            document.getElementById(
                "modalCarId"
            ).textContent = car.car_id;

            document.getElementById(
                "modalDescription"
            ).textContent = car.car_description;

            document.getElementById(
                "modalDate"
            ).textContent = car.established_date;

            document.getElementById(
                "modalRating"
            ).textContent = car.rating + " / 10";

            const rating = Math.max(
                0,
                Math.min(10, Number(car.rating) || 0)
            );

            const ratingBar =
                document.getElementById("ratingBar");

            ratingBar.style.width =
                (rating * 10) + "%";

            ratingBar.setAttribute(
                "aria-valuenow",
                rating
            );

            fullDetailsLink.href =
                "car-details.php?id=" + id;

            fullDetailsLink.hidden = false;

            modalStatus.textContent = "";

            modalDetails.hidden = false;

        })

        .catch(() => {

            if (requestId !== latestRequest) {

                return;

            }

            modalStatus.textContent =
                "Unable to load car details.";

        });

}

// Load cars when page opens
loadCars();

</script>

</body>

</html>
