
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>AJAX Car Dropdown | My Cars System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #f5f7fa;
        }

        .search-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        #carDropdown {
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
        }

        .dropdown-item {
            white-space: normal;
            padding: 12px;
        }

        .dropdown-item:hover {
            background: #edf7f0;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="list-cars.php">

            My Cars System

        </a>

        <a href="list-cars.php"
           class="btn btn-outline-light btn-sm">

            Back to Cars

        </a>

    </div>

</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="search-card">

                <h2>AJAX Car Search</h2>

                <p class="text-muted">

                    Type a car name to display matching
                    cars without refreshing the page.

                </p>

                <div class="dropdown">

                    <label for="carSearch"
                           class="form-label">

                        Search Car

                    </label>

                    <input type="text"
                           id="carSearch"
                           class="form-control"
                           placeholder="Enter car name..."
                           maxlength="150"
                           autocomplete="off"
                           aria-controls="carDropdown"
                           aria-expanded="false">

                    <div id="carDropdown"
                         class="dropdown-menu">

                    </div>

                </div>

                <div id="searchStatus"
                     class="text-muted mt-3"
                     aria-live="polite">

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const searchInput =
    document.getElementById("carSearch");

const dropdown =
    document.getElementById("carDropdown");

const statusMessage =
    document.getElementById("searchStatus");

let latestRequest = 0;

let searchTimer;

// Hide dropdown
function hideDropdown() {

    dropdown.classList.remove("show");

    searchInput.setAttribute(
        "aria-expanded",
        "false"
    );

}

// Show dropdown
function showDropdown() {

    dropdown.classList.add("show");

    searchInput.setAttribute(
        "aria-expanded",
        "true"
    );

}

// Search cars using AJAX
searchInput.addEventListener("input", function () {

    clearTimeout(searchTimer);

    const requestId = ++latestRequest;

    const name = this.value.trim();

    dropdown.replaceChildren();

    hideDropdown();

    if (name === "") {

        statusMessage.textContent = "";

        return;

    }

    statusMessage.textContent = "Searching...";

    searchTimer = setTimeout(function () {

        fetch(
            "ajax.php?name=" +
            encodeURIComponent(name)
        )

        .then(response => {

            if (!response.ok) {

                throw new Error("Request failed");

            }

            return response.json();

        })

        .then(cars => {

            if (requestId !== latestRequest) {

                return;

            }

            dropdown.replaceChildren();

            if (cars.length === 0) {

                statusMessage.textContent =
                    "No matching cars found.";

                hideDropdown();

                return;

            }

            cars.forEach(car => {

                const id = Number(car.car_id);

                if (!Number.isSafeInteger(id) || id < 1) {

                    return;

                }

                const item =
                    document.createElement("a");

                item.className = "dropdown-item";

                item.href =
                    "car-details.php?id=" + id;

                const carName =
                    document.createElement("strong");

                carName.textContent = car.car_name;

                const details =
                    document.createElement("small");

                details.className =
                    "d-block text-muted";

                details.textContent =
                    "Rating: " + car.rating +
                    "/10 | Established: " +
                    car.established_date;

                item.appendChild(carName);

                item.appendChild(details);

                dropdown.appendChild(item);

            });

            statusMessage.textContent =
                cars.length + " matching car(s) found.";

            showDropdown();

        })

        .catch(() => {

            if (requestId !== latestRequest) {

                return;

            }

            hideDropdown();

            statusMessage.textContent =
                "Unable to load cars.";

        });

    }, 250);

});

// Close dropdown when clicking outside
document.addEventListener("click", function (event) {

    if (
        !searchInput.contains(event.target) &&
        !dropdown.contains(event.target)
    ) {

        hideDropdown();

    }

});

// Reopen existing results when focusing
searchInput.addEventListener("focus", function () {

    if (dropdown.children.length > 0) {

        showDropdown();

    }

});

// Close dropdown using Escape
searchInput.addEventListener("keydown", function (event) {

    if (event.key === "Escape") {

        hideDropdown();

    }

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
